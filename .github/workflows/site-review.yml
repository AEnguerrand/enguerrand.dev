name: Site review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-review:
    name: Site checks and review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate and capture review evidence
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run review:site -- --base "$REVIEW_BASE"
      - name: Add the review summary
        if: always()
        run: |
          if [ -d artifacts/site-review ]; then
            find artifacts/site-review -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the review package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/site-review/
          if-no-files-found: warn
          retention-days: 14
